<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>AI Studio - 次世代圖卡產生器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: 'Inter', sans-serif; }
        .canvas-container { aspect-ratio: 16/9; width: 100%; border-radius: 20px; overflow: hidden; position: relative; background: #111; display: flex; align-items: center; }
        .bg-layer { position: absolute; inset: 0; background-size: cover; background-position: center; transition: background 0.5s ease; }
        .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); }
        .text-layer { position: relative; z-index: 10; padding: 60px; width: 100%; display: flex; flex-direction: column; }
    </style>
</head>
<body class="p-8">
    <main class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-12 gap-8">
        <!-- 功能區 -->
        <div class="md:col-span-4 space-y-6">
            <input id="mainTitle" type="text" placeholder="主標題" class="w-full bg-zinc-900 p-4 rounded-xl border border-zinc-700">
            <input id="subTitle" type="text" placeholder="副標題" class="w-full bg-zinc-900 p-4 rounded-xl border border-zinc-700">
            <select id="styleSelect" class="w-full bg-zinc-900 p-4 rounded-xl border border-zinc-700">
                <option value="luxury">高級感 Luxury</option>
                <option value="minimalist">極簡風 Minimalist</option>
                <option value="tech">科技感 Tech</option>
            </select>
            <button onclick="fetchImage()" class="w-full bg-white text-black py-4 rounded-xl font-bold">更換 AI 背景</button>
        </div>
        
        <!-- 預覽區 -->
        <div class="md:col-span-8">
            <div class="canvas-container" id="canvasBox">
                <div id="bgLayer" class="bg-layer"></div>
                <div class="overlay"></div>
                <div id="textLayer" class="text-layer items-start">
                    <h1 id="outMain" class="text-6xl font-black mb-4"></h1>
                    <h2 id="outSub" class="text-2xl font-light opacity-80"></h2>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_KEY = 'RKN05GazMkLLJiykYmmsZTWELjtDPmMexoOahZz8LwoveEHwug6JhErh';
        
        // 即時文字更新
        document.getElementById('mainTitle').addEventListener('input', (e) => document.getElementById('outMain').innerText = e.target.value);
        document.getElementById('subTitle').addEventListener('input', (e) => document.getElementById('outSub').innerText = e.target.value);

        // 背景生成
        async function fetchImage() {
            const style = document.getElementById('styleSelect').value;
            const res = await fetch(`https://api.pexels.com/v1/search?query=${style}&per_page=15`, {
                headers: { 'Authorization': API_KEY }
            });
            const data = await res.json();
            const photo = data.photos[Math.floor(Math.random() * data.photos.length)];
            document.getElementById('bgLayer').style.backgroundImage = `url(${photo.src.large2x})`;
        }
    </script>
</body>
</html>
