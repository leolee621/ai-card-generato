<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horizon Design | 頂流視覺系統</title>
  <style>
    :root {
      --accent-color: #ff5e00;
      --panel-bg: rgba(0, 0, 0, 0.6);
    }

    body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', -apple-system, sans-serif; background: #050505; color: white; }

    /* 背景引擎 */
    #bg-layer { position: fixed; inset: 0; z-index: -1; transition: background 1s ease; background-size: cover; background-position: center; filter: brightness(0.6) blur(20px); }

    /* 控制面板 */
    .control-panel {
      position: absolute; top: 40px; left: 40px;
      padding: 20px; background: var(--panel-bg);
      backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; z-index: 10;
    }

    select {
      background: transparent; border: 1px solid var(--accent-color);
      color: white; padding: 10px; border-radius: 8px; cursor: pointer;
    }

    /* 主視覺內容 */
    .content {
      height: 100vh; display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
    }
  </style>
</head>
<body>

  <div id="bg-layer"></div>

  <div class="control-panel">
    <label>選擇視覺風格：</label>
    <select id="styleSelect" onchange="updateStyle()">
      <option value="cyber">賽博奢華橘</option>
      <option value="liquid">迷幻液態流光</option>
      <option value="abstract">大膽極簡抽象</option>
      <option value="sunset">黃金日落餘暉</option>
      <option value="dark">迷離暗黑迷宮</option>
    </select>
  </div>

  <div class="content">
    <h1 style="font-size: 3rem; letter-spacing: -2px;">超越極限的視覺</h1>
    <p>目前的風格引擎已啟動，請選擇上方選單調整氛圍。</p>
  </div>

  <script>
    const API_KEY = 'YOUR_PEXELS_API_KEY'; // 在此填入你的金鑰
    
    const themes = {
      cyber: 'orange neon cyberpunk architecture',
      liquid: 'holographic liquid abstract',
      abstract: 'bold minimalist geometric art',
      sunset: 'vibrant golden hour sunset',
      dark: 'deep black moody minimal tech'
    };

    async function updateStyle() {
      const type = document.getElementById('styleSelect').value;
      const bgLayer = document.getElementById('bg-layer');
      
      try {
        const response = await fetch(`https://api.pexels.com/v1/search?query=${themes[type]}&per_page=1`, {
          headers: { Authorization: API_KEY }
        });
        const data = await response.json();
        if(data.photos.length > 0) {
          bgLayer.style.backgroundImage = `url(${data.photos[0].src.original})`;
        }
      } catch (err) {
        console.error("風格載入失敗，請檢查 API Key");
      }
    }

    // 初始化
    updateStyle();
  </script>
</body>
</html>
