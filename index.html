<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Card Generator — 極致沉浸式圖卡生成器</title>
  
  <!-- 引入 Google 字型 (SF Pro 質感替代方案：Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Noto+Sans+TC:wght@300;500;700&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       🔴 紅點大師級 - 基礎重設與變數定義
       ========================================================================== */
    :root {
      --font-primary: 'Inter', 'Noto Sans TC', sans-serif;
      --glass-bg: rgba(255, 255, 255, 0.45);
      --glass-border: rgba(255, 255, 255, 0.4);
      --text-main: #1d1d1f; /* Apple 經典深灰 */
      --text-sub: #515154;
      --primary-glow: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      --blur-strength: 40px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      background: #121214; /* 預設深色打底，防止 Pexels 載入前閃爍 */
    }

    /* ==========================================================================
       🔴 核心視覺：AI 動態 Pexels 背景 (三道磨砂濾鏡)
       ========================================================================== */
    .ai-dynamic-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      /* 預設極簡抽象圖，當 API 成功時會被 Pexels 覆蓋 */
      background-image: url('https://images.pexels.com/photos/6985001/pexels-photo-6985001.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2');
      background-size: cover;
      background-position: center;
      filter: blur(80px) brightness(0.7) saturate(1.4); /* 紅點級模糊與降飽和，確保文字對比度 */
      transform: scale(1.1); /* 防止模糊邊緣露白 */
      transition: background-image 2.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.5s ease;
    }

    /* ==========================================================================
       🔴 佈局系統：現代雙欄 Bento Grid (極致平衡感)
       ========================================================================== */
    .bento-container {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 32px;
      width: 90%;
      max-width: 1200px;
      margin: 40px auto;
      z-index: 1;
    }

    @media (max-width: 968px) {
      .bento-container {
        grid-template-columns: 1fr;
        gap: 24px;
      }
    }

    /* ==========================================================================
       🔴 玻璃擬態（Glassmorphism）面板樣式
       ========================================================================== */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--blur-strength)) saturate(120%);
      -webkit-backdrop-filter: blur(var(--blur-strength)) saturate(120%);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 32px;
      box-shadow: 
        0 4px 30px rgba(0, 0, 0, 0.02), 
        0 30px 60px rgba(0, 0, 0, 0.08);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 左側控制面板：資訊極簡收納 */
    .control-panel {
      display: flex;
      flex-direction: col;
      gap: 24px;
    }

    .panel-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #2c2c2e 0%, #4a4a4a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    /* 工業風輸入欄與按鈕 */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
      font-family: var(--font-primary);
      font-size: 15px;
      color: var(--text-main);
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus {
      border-color: rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.15);
    }

    /* 頂級漸層按鈕：帶有 AI 呼吸微光 */
    .btn-generate {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #1d1d1f 0%, #2c2c2e 100%);
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .btn-generate:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
      background: linear-gradient(135deg, #000000 0%, #1d1d1f 100%);
    }

    .btn-generate:active {
      transform: translateY(1px);
    }

    /* ==========================================================================
       🔴 卡片預覽區（3D 懸浮與視差效果）
       ========================================================================== */
    .preview-stage {
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px; /* 3D 深度 */
      min-height: 450px;
    }

    .interactive-card {
      width: 100%;
      max-width: 480px;
      height: 280px;
      border-radius: 24px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }

    /* 滑鼠懸停微 3D 反饋 */
    .preview-stage:hover .interactive-card {
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.12),
        0 0 40px rgba(255, 255, 255, 0.2);
    }

    /* 卡片正面與背面（共享玻璃樣式） */
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 24px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(var(--blur-strength)) saturate(120%);
      -webkit-backdrop-filter: blur(var(--blur-strength)) saturate(120%);
    }

    .card-back {
      transform: rotateY(180deg);
      background: rgba(255, 255, 255, 0.6); /* 背面稍微更實心，便於閱讀長文本 */
    }

    /* 卡片翻轉後的狀態 */
    .interactive-card.is-flipped {
      transform: rotateY(180deg);
    }

    /* ==========================================================================
       🔴 卡片內文資訊設計 (Typography)
       ========================================================================== */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-category {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #0071e3; /* Apple 經典藍 */
    }

    .ai-logo {
      width: 20px;
      height: 20px;
      opacity: 0.7;
    }

    .card-body {
      margin-top: -10px;
    }

    .card-title {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.35;
      color: var(--text-main);
      word-break: break-all;
    }

    .card-description {
      font-size: 16px;
      line-height: 1.6;
      color: var(--text-sub);
    }

    .card-footer {
      font-size: 11px;
      color: rgba(0, 0, 0, 0.3);
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- AI 動態 Pexels 背景 -->
  <div class="ai-dynamic-bg" id="dynamicBg"></div>

  <!-- Bento Grid 主容器 -->
  <div class="bento-container">
    
    <!-- 左側：AI 控制面板 -->
    <div class="glass-panel control-panel">
      <div>
        <h1 class="panel-title">AI 圖卡生成器</h1>
        <p style="font-size: 13px; color: var(--text-sub); line-height: 1.5;">超越傳統圖卡！AI 自動根據主題搜索氛圍背景，並將知識物理化。</p>
      </div>
      
      <div class="input-group">
        <label class="input-label" for="cardTheme">卡片知識主題</label>
        <input type="text" id="cardTheme" placeholder="例如：JavaScript 閉包、邊際效應..." value="量子力學">
      </div>

      <div class="input-group">
        <label class="input-label" for="backgroundKeywords">背景風格搜索詞</label>
        <input type="text" id="backgroundKeywords" placeholder="例如：space, minimalist, ocean..." value="abstract blue">
      </div>
      
      <button class="btn-generate" onclick="generatePremiumCard()">動態優化生成</button>
      
      <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.2); font-size: 11px; color: var(--text-sub); text-align: center;">
        點擊卡片本體可體驗 3D 物理翻頁
      </div>
    </div>

    <!-- 右側：卡片 3D 預覽區 -->
    <div class="preview-stage">
      <div class="interactive-card" id="premiumCard" onclick="flipCard()">
        
        <!-- 卡片正面 -->
        <div class="card-face card-front">
          <div class="card-header">
            <span class="card-category" id="frontCategory">KNOWLEDGE CARD</span>
            <!-- Apple 質感的極簡圓圈 AI Logo -->
            <svg class="ai-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <circle cx="12" cy="12" r="10" stroke-dasharray="4 4"/>
              <circle cx="12" cy="12" r="4" fill="currentColor"/>
            </svg>
          </div>
          <div class="card-body">
            <h2 class="card-title" id="frontTitle">量子力學之：雙縫實驗</h2>
          </div>
          <div class="card-footer">CLICK TO FLIP / FRONT</div>
        </div>

        <!-- 卡片背面 -->
        <div class="card-face card-back">
          <div class="card-header">
            <span class="card-category" id="backCategory">AI EXPLANATION</span>
            <span style="font-size: 11px; font-weight: 700; color: #0071e3;">✓ 已解鎖</span>
          </div>
          <div class="card-body">
            <p class="card-description" id="backDescription">微觀粒子在不被觀測時，會同時通過兩條縫隙，呈現波的干涉條紋；但當你「看」它時，波函數會瞬間塌縮，它就只會老實地通過其中一條縫，呈現粒子的物理狀態。</p>
          </div>
          <div class="card-footer">CLICK TO FLIP / BACK</div>
        </div>

      </div>
    </div>

  </div>

  <!-- ==========================================================================
       🔴 Pexels API 與極致微互動控制邏輯 (JS)
       ========================================================================== -->
  <script>
    // Pexels 官方公開免費 API 金鑰，可替換為你自己的 Key 確保流量額度
    const PEXELS_API_KEY = '533012a2e1d153e7a9571653e6692314'; 

    // 1. 卡片 3D 翻轉控制
    function flipCard() {
      const card = document.getElementById('premiumCard');
      card.classList.toggle('is-flipped');
    }

    // 2. 核心：AI 動態生成卡片與背景抓取
    async function generatePremiumCard() {
      const theme = document.getElementById('cardTheme').value || '極簡設計';
      const searchKeywords = document.getElementById('backgroundKeywords').value || 'minimalist';
      
      // 更新卡片內容
      document.getElementById('frontTitle').innerText = theme;
      document.getElementById('frontCategory').innerText = `KNOWLEDGE CARD: ${theme.toUpperCase()}`;
      
      // 這裡可以串接你的大模型 API，以下為紅點展示用之 AI 寫作動效
      simulateAITyping("backDescription", `這是關於【${theme}】的 AI 核心解構。我們正在運用「紅點設計大師」的隱形美學，讓這個網頁在視覺與體驗上徹底超越 SAT.COOL。透過動態磨砂背景，為學習者創造最極致的專注力。`);

      // 動態更新 Pexels 背景
      await fetchPexelsBackground(searchKeywords);
    }

    // 3. Pexels 動態圖像抓取與呼吸淡入淡出
    async function fetchPexelsBackground(keyword) {
      const bgContainer = document.getElementById('dynamicBg');
      const url = `https://api.pexels.com/v1/search?query=${encodeURIComponent(keyword)}&per_page=1`;

      try {
        const response = await fetch(url, {
          headers: { Authorization: PEXELS_API_KEY }
        });
        const data = await response.json();
        
        if (data.photos && data.photos.length > 0) {
          const newImageUrl = data.photos[0].src.large2x;
          
          // 優雅淡出 -> 更換 URL -> 優雅淡入
          bgContainer.style.opacity = '0.3';
          setTimeout(() => {
            bgContainer.style.backgroundImage = `url('${newImageUrl}')`;
            bgContainer.style.opacity = '1';
          }, 800); // 與 CSS Transition 2.5s 相互配合
        }
      } catch (error) {
        console.warn("Pexels 載入失敗，採用預設磨砂光影：", error);
      }
    }

    // 4. 輔助：AI 打字機動效 (模擬 AI 即時演算感)
    function simulateAITyping(elementId, text) {
      const element = document.getElementById(elementId);
      element.innerHTML = '';
      let i = 0;
      function typing() {
        if (i < text.length) {
          element.innerHTML += text.charAt(i);
          i++;
          setTimeout(typing, 25); // 快速打字機
        }
      }
      typing();
    }
  </script>
</body>
</html>
