<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Course Card Generator 5.0 - 超越 Sat.cool</title>
    <!-- 引入高解析度 HTML 轉圖片庫 (超越 sat.cool 的核心，確保匯出不模糊) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-glow: radial-gradient(circle at 50% 50%, #1a1528 0%, #09070f 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-glow: 0px 8px 32px 0px rgba(0, 0, 0, 0.37);
            --accent-orange: #ff5e00;
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-glow);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* 頂級背景微光粒子 */
        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.12) 0%, rgba(0,0,0,0) 70%);
            top: 10%;
            left: 15%;
            z-index: -1;
            filter: blur(50px);
        }

        .container {
            width: 90%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            padding: 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: var(--glass-glow);
            z-index: 1;
        }

        /* 左側控制面板 */
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 5px 0;
            background: linear-gradient(135deg, #fff 0%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        input, textarea, select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 10px rgba(255,255,255,0.05);
        }

        /* 風格選擇下拉選單 */
        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='white' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
            padding-right: 40px;
        }

        /* 必修開關 */
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.15);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input { display: none; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #3a3a3c;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-orange);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        /* 頂級實體感按鈕 */
        .export-btn {
            background: linear-gradient(135deg, #ff7b00 0%, #ff4500 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 94, 0, 0.3);
            transition: all 0.3s;
        }

        .export-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 94, 0, 0.5);
        }

        /* 右側預覽區 */
        .preview-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .preview-header {
            font-size: 14px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        /* 16:9 實體預覽卡片 (增加 crossOrigin 屬性以利導出) */
        .card-16-9 {
            width: 100%;
            aspect-ratio: 16/9;
            background: #0d0b14;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            box-sizing: border-box;
        }

        /* 圖片背景 */
        .card-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.45; /* 略微調亮背景，使匯出的視覺飽和度更震撼 */
            z-index: 1;
            transition: all 0.5s ease;
        }

        /* 磨砂玻璃覆蓋層 */
        .card-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, rgba(13,11,20,0.92) 35%, rgba(13,11,20,0.2) 100%);
            z-index: 2;
        }

        /* 內容物排版 */
        .card-content {
            position: relative;
            z-index: 3;
            max-width: 65%;
            pointer-events: none;
        }

        .card-title {
            font-size: 2.4rem;
            font-weight: 800;
            margin-bottom: 14px;
            color: #fff;
            line-height: 1.3;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .card-sub {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.75);
            line-height: 1.6;
            font-weight: 400;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        /* 必修標籤 */
        .badge-required {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: var(--accent-orange);
            color: white;
            padding: 8px 22px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 94, 0, 0.5);
            letter-spacing: 1px;
            z-index: 3;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .active .badge-required {
            opacity: 1;
            transform: scale(1);
        }

        /* 頂級毛玻璃通知元件 (Toast Notifications) */
        .toast-container {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toast {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 16px 24px;
            border-radius: 16px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            transform: translateY(-20px) scale(0.9);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 500;
        }

        .toast.show {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .toast-spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: var(--accent-orange);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 預覽背景庫 */
        .style-luxury { background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1200&auto=format&fit=crop'); }
        .style-watercolor { background-image: url('https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?q=80&w=1200&auto=format&fit=crop'); }
        .style-minimalist { background-image: url('https://images.unsplash.com/photo-1618005198143-d366803e73cc?q=80&w=1200&auto=format&fit=crop'); }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="container">
        <!-- 左側控制面板 -->
        <div class="control-panel">
            <div>
                <h1>AI 圖卡生成器 5.0</h1>
                <p style="color: var(--text-secondary); font-size: 13px; margin: 0;">超越 Sat.cool 的極致視覺體驗</p>
            </div>

            <div class="input-group">
                <label>1. 主標題 (Main Title)</label>
                <input type="text" id="mainTitleInput" value="新人銷售基礎入門" placeholder="請輸入主標題">
            </div>

            <div class="input-group">
                <label>2. 副標題 (Sub-Title)</label>
                <textarea id="subTitleInput" rows="3" placeholder="請輸入副標題">金城武親自示範・從零開始・心態與技巧</textarea>
            </div>

            <div class="input-group">
                <label>3. 智慧 AI 背景風格 (AI Background Style)</label>
                <select id="styleSelect">
                    <option value="style-luxury">尊爵科技奢華 (Luxury Tech)</option>
                    <option value="style-watercolor">藝術溫暖水彩 (Warm Watercolor)</option>
                    <option value="style-minimalist">現代極簡漸層 (Minimalist Gradient)</option>
                </select>
            </div>

            <div class="toggle-container">
                <span style="font-size: 14px; font-weight: 500;">是否啟用 "必修" 標籤</span>
                <label class="switch">
                    <input type="checkbox" id="requiredToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <!-- 呼叫極致無損匯出函數 -->
            <button class="export-btn" onclick="exportHighResolutionCard()">一鍵打包匯出 (Export)</button>
        </div>

        <!-- 右側預覽區 -->
        <div class="preview-panel">
            <div class="preview-header">
                <span>🖥️ 16:9 智慧環境預覽 (Live Preview)</span>
                <span style="color: var(--accent-orange)">● AI 實時渲染中</span>
            </div>
            
            <!-- 16:9 預覽卡片 -->
            <div class="card-16-9 active" id="cardPreview">
                <!-- 設置 crossOrigin 確保外部 Unsplash 圖片能被 Canvas 正常抓取而不會產生安全沙盒報錯 -->
                <div class="card-bg style-luxury" id="cardBg" crossorigin="anonymous"></div>
                <div class="card-overlay"></div>
                
                <div class="card-content">
                    <div class="card-title" id="previewTitle">新人銷售基礎入門</div>
                    <div class="card-sub" id="previewSub">金城武親自示範・從零開始・心態與技巧</div>
                </div>

                <div class="badge-required" id="badgeReq">必修</div>
            </div>
        </div>
    </div>

    <!-- 頂層 Toast 提示容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        const mainInput = document.getElementById('mainTitleInput');
        const subInput = document.getElementById('subTitleInput');
        const styleSelect = document.getElementById('styleSelect');
        const requiredToggle = document.getElementById('requiredToggle');

        const previewTitle = document.getElementById('previewTitle');
        const previewSub = document.getElementById('previewSub');
        const cardBg = document.getElementById('cardBg');
        const cardPreview = document.getElementById('cardPreview');
        const toastContainer = document.getElementById('toastContainer');

        // 頂級 Toast UI 交互邏輯
        function showToast(message, type = 'info', duration = 3000) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            
            let iconHtml = '';
            if (type === 'loading') {
                iconHtml = '<div class="toast-spinner"></div>';
            } else if (type === 'success') {
                iconHtml = '<span style="color: #34c759; font-weight: bold;">✓</span>';
            } else if (type === 'error') {
                iconHtml = '<span style="color: #ff3b30; font-weight: bold;">✕</span>';
            }

            toast.innerHTML = `${iconHtml} <span>${message}</span>`;
            toastContainer.appendChild(toast);

            // 觸發漸顯動畫
            setTimeout(() => toast.classList.add('show'), 10);

            if (type !== 'loading') {
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 400);
                }, duration);
            }
            return toast; // 返回實例以便手動關閉 Loading
        }

        // 文字即時渲染
        mainInput.addEventListener('input', (e) => {
            previewTitle.innerText = e.target.value || "請輸入主標題";
        });

        subInput.addEventListener('input', (e) => {
            previewSub.innerText = e.target.value || "請輸入副標題";
        });

        // 智慧背景即時切換
        styleSelect.addEventListener('change', (e) => {
            cardBg.className = 'card-bg ' + e.target.value;
        });

        // 必修標籤開關
        requiredToggle.addEventListener('change', (e) => {
            if(e.target.checked) {
                cardPreview.classList.add('active');
            } else {
                cardPreview.classList.remove('active');
            }
        });

        // ★ 核心超越功能：3倍超採樣高清無損導出引擎 ★
        function exportHighResolutionCard() {
            const loadingToast = showToast("AI 正在深度解析 16:9 佈局與色彩...", "loading");
            
            const card = document.getElementById('cardPreview');
            
            // 使用 html2canvas 進行渲染優化
            // 關鍵參數 scale: 3 可獲得 300% 視網膜超清分辨率，遠超 sat.cool 的清晰度！
            html2canvas(card, {
                scale: 3, 
                useCORS: true,       // 允許跨域加載 Unsplash 高清背景圖，避免白屏
                allowTaint: false,
                backgroundColor: null,
                logging: false
            }).then(canvas => {
                // 自動關閉 Loading
                loadingToast.classList.remove('show');
                setTimeout(() => loadingToast.remove(), 400);

                // 將 Canvas 轉為實體超高清 PNG
                const link = document.createElement('a');
                const titleText = mainInput.value.trim() || 'AI-CourseCard';
                link.download = `${titleText}-PremiumCard.png`;
                link.href = canvas.toDataURL('image/png');
                
                // 觸發物理下載
                link.click();
                
                // 提示成功
                showToast("✨ 16:9 超高清圖卡已成功匯出至下載資料夾！", "success", 4000);
            }).catch(err => {
                console.error("Export Error: ", err);
                loadingToast.remove();
                showToast("匯出失敗，請重試或更換背景風格！", "error", 4000);
            });
        }
    </script>
</body>
</html>
