<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 奢華圖卡生成器 | 頂流美學</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0a0a;
      --accent-orange: #ff5e00;
      --glass: rgba(255, 255, 255, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Noto Sans TC', sans-serif; 
      background-color: var(--bg-dark); 
      color: #fff;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; overflow: hidden;
    }

    /* 動態背景層 */
    #bg-layer {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-size: cover; background-position: center;
      filter: blur(80px) brightness(0.6); z-index: -1;
      transition: background 1s ease;
    }

    .container {
      display: grid; grid-template-columns: 350px 500px;
      gap: 40px; padding: 40px;
      background: var(--glass);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
    }

    /* 控制面板 */
    .controls { display: flex; flex-direction: column; gap: 20px; }
    input { 
      padding: 15px; border-radius: 12px; border: none;
      background: rgba(255,255,255,0.1); color: white;
    }
    button {
      padding: 15px; border-radius: 12px; border: none;
      background: var(--accent-orange); color: white;
      font-weight: 900; cursor: pointer; transition: 0.3s;
    }
    button:hover { transform: scale(1.02); filter: brightness(1.2); }

    /* 3D 卡片 */
    .card-scene { perspective: 1000px; }
    .card {
      width: 500px; height: 300px;
      position: relative; transition: transform 0.8s;
      transform-style: preserve-3d; cursor: pointer;
    }
    .card.is-flipped { transform: rotateY(180deg); }
    .face {
      position: absolute; width: 100%; height: 100%;
      backface-visibility: hidden;
      display: flex; justify-content: center; align-items: center;
      border-radius: 20px; border: 1px solid rgba(255,255,255,0.2);
      padding: 40px; text-align: center; background: rgba(0,0,0,0.4);
    }
    .back { transform: rotateY(180deg); }
  </style>
</head>
<body>

  <div id="bg-layer"></div>

  <div class="container">
    <div class="controls">
      <h1>AI 內容生成</h1>
      <input type="text" id="themeInput" placeholder="輸入知識主題...">
      <button onclick="generateContent()">生成圖卡</button>
    </div>

    <div class="card-scene">
      <div class="card" id="card" onclick="this.classList.toggle('is-flipped')">
        <div class="face front"><h2 id="title">量子糾纏</h2></div>
        <div class="face back"><p id="desc">點擊這裡查看 AI 生成的知識解讀...</p></div>
      </div>
    </div>
  </div>

  <script>
    const PEXELS_API_KEY = 'RKN05GazMkLLJiykYmmsZTWELjtDPmMexoOahZz8LwoveEHwug6JhErh'; // 這裡填入你的 Key

    async function generateContent() {
      const theme = document.getElementById('themeInput').value;
      document.getElementById('title').innerText = theme;
      document.getElementById('desc').innerText = `正在為您探索關於「${theme}」的奧秘...`;
      
      // 更新背景
      const res = await fetch(`https://api.pexels.com/v1/search?query=${theme}&per_page=1`, {
        headers: { Authorization: PEXELS_API_KEY }
      });
      const data = await res.json();
      if(data.photos.length > 0) {
        document.getElementById('bg-layer').style.backgroundImage = `url(${data.photos[0].src.original})`;
      }
    }
  </script>
</body>
</html>
