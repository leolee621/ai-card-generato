<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Course Card Generator - Premium Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background: #0f172a; color: white; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .canvas-container { position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 16px; overflow: hidden; background: #222; }
    </style>
</head>
<body class="p-8 md:p-16">

    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12">
        
        <!-- 左側：功能區 -->
        <div class="glass p-8 rounded-3xl space-y-6">
            <h1 class="text-2xl font-bold mb-6">AI Course Card Generator</h1>
            
            <input id="mainTitle" type="text" placeholder="輸入主標文字" class="w-full bg-white/10 p-4 rounded-xl border border-white/20 focus:outline-none">
            <input id="subTitle" type="text" placeholder="輸入副標文字" class="w-full bg-white/10 p-4 rounded-xl border border-white/20 focus:outline-none">
            
            <div class="flex gap-4">
                <button onclick="setAlignment('left')" class="flex-1 p-3 bg-white/10 rounded-lg hover:bg-white/20">靠左</button>
                <button onclick="setAlignment('right')" class="flex-1 p-3 bg-white/10 rounded-lg hover:bg-white/20">靠右</button>
                <button onclick="setAlignment('hidden')" class="flex-1 p-3 bg-red-900/50 rounded-lg">隱藏文字</button>
            </div>

            <input type="file" id="imageUpload" class="block w-full text-sm text-gray-400 file:bg-blue-600 file:text-white file:py-2 file:px-4 file:rounded-full border border-dashed border-gray-600 p-4 rounded-xl">

            <select id="styleSelect" class="w-full bg-black/30 p-4 rounded-xl border border-white/20">
                <option>Luxury</option>
                <option>Watercolor</option>
                <option>Minimalist</option>
                <option>Tech</option>
                <option>Abstract</option>
            </select>

            <button onclick="fetchPexelsImage()" class="w-full p-4 bg-white text-black font-bold rounded-xl hover:scale-[1.02] transition">更換圖片 (AI 智能生成)</button>
            <button onclick="exportImage()" class="w-full p-4 bg-blue-600 text-white font-bold rounded-xl shadow-lg shadow-blue-600/50">一鍵匯出</button>
        </div>

        <!-- 右側：預覽區 -->
        <div class="flex flex-col items-center justify-center">
            <div id="previewCard" class="canvas-container shadow-2xl flex flex-col justify-center p-12 transition-all duration-500">
                <div id="textLayer" class="z-10">
                    <h2 id="displayMain" class="text-5xl font-black mb-4">主標文字</h2>
                    <p id="displaySub" class="text-xl opacity-80">副標文字</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        const PEXELS_API_KEY = 'YOUR_PEXELS_API_KEY';
        let usedIds = new Set();

        function setAlignment(align) {
            const el = document.getElementById('textLayer');
            if(align === 'hidden') el.style.display = 'none';
            else {
                el.style.display = 'block';
                el.style.textAlign = align;
            }
        }

        async function fetchPexelsImage() {
            const style = document.getElementById('styleSelect').value;
            const res = await fetch(`https://api.pexels.com/v1/search?query=${style}&per_page=15`, {
                headers: { Authorization: PEXELS_API_KEY }
            });
            const data = await res.json();
            const photos = data.photos.filter(p => !usedIds.has(p.id));
            if(photos.length > 0) {
                const photo = photos[Math.floor(Math.random() * photos.length)];
                usedIds.add(photo.id);
                document.getElementById('previewCard').style.backgroundImage = `url(${photo.src.large})`;
                document.getElementById('previewCard').style.backgroundSize = 'cover';
            }
        }

        // 即時監聽輸入
        document.getElementById('mainTitle').addEventListener('input', (e) => document.getElementById('displayMain').innerText = e.target.value);
        document.getElementById('subTitle').addEventListener('input', (e) => document.getElementById('displaySub').innerText = e.target.value);

        function exportImage() { alert("系統正在處理高畫質渲染，準備匯出..."); }
    </script>
</body>
</html>
