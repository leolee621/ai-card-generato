<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 奢華金屬橘圖卡生成器</title>
  
  <!-- 引入極致質感的字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       🔴 奢華金屬橘 - 基礎設定與變數
       ========================================================================== */
    :root {
      --font-primary: 'Noto Sans TC', sans-serif;
      --orange-primary: #ff5e00; /* 奢華愛馬仕橘 */
      --orange-glow: linear-gradient(135deg, #ff9f43 0%, #ff5e00 100%);
      --metal-border: rgba(255, 94, 0, 0.45); /* 金屬橘半透明邊框 */
      --glass-bg: rgba(20, 15, 12, 0.65); /* 暗金色調玻璃底色 */
      --text-light: #ffffff;
      --text-sub: #ffbd9b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-primary);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      background: #0a0806; /* 極深曜黑打底 */
    }

    /* ==========================================================================
       🔴 核心視覺：AI 動態鮮豔背景 (高飽和度磨砂濾鏡)
       ========================================================================== */
    .ai-dynamic-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      /* 預設鮮豔橘色背景 */
      background-image: url('https://images.pexels.com/photos/1103970/pexels-photo-1103970.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2');
      background-size: cover;
      background-position: center;
      filter: blur(60px) brightness(0.85) saturate(1.8); /* 提高亮度與飽和度，呈現極致鮮豔 */
      transform: scale(1.15);
      transition: background-image 2s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.2s ease;
    }

    /* ==========================================================================
       🔴 佈局系統：雙欄 Bento Grid
       ========================================================================== */
    .bento-container {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 32px;
      width: 90%;
      max-width: 1200px;
      margin: 40px auto;
      z-index: 1;
    }

    @media (max-width: 1024px) {
      .bento-container {
        grid-template-columns: 1fr;
        gap: 24px;
      }
    }

    /* ==========================================================================
       🔴 奢華暗金玻璃擬態面板
       ========================================================================== */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(40px) saturate(140%);
      -webkit-backdrop-filter: blur(40px) saturate(140%);
      border: 1px solid var(--metal-border);
      border-radius: 28px;
      padding: 36px;
      box-shadow: 
        0 4px 30px rgba(255, 94, 0, 0.05), 
        0 30px 60px rgba(0, 0, 0, 0.4);
    }

    .control-panel {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .panel-title {
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .panel-title span {
      background: var(--orange-glow);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ==========================================================================
       🎨 5種鮮豔風格控制器 (UI 排版)
       ========================================================================== */
    .style-controller-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .style-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .style-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 94, 0, 0.2);
      padding: 12px 18px;
      border-radius: 14px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .style-btn:hover {
      background: rgba(255, 94, 0, 0.15);
      border-color: var(--orange-primary);
    }

    /* 按鈕中獨立的「隨機再生成 🔄」小按鈕 */
    .regen-icon {
      background: rgba(255, 94, 0, 0.2);
      border: 1px solid var(--orange-primary);
      color: #ffffff;
      border-radius: 8px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      transition: all 0.2s ease;
    }

    .regen-icon:hover {
      background: var(--orange-primary);
      transform: rotate(180deg);
    }

    /* 工業風輸入欄 */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid rgba(255, 94, 0, 0.3);
      background: rgba(0, 0, 0, 0.3);
      font-size: 15px;
      color: #ffffff;
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus {
      border-color: var(--orange-primary);
      box-shadow: 0 0 0 4px rgba(255, 94, 0, 0.25);
    }

    /* 金屬橘主生成按鈕 */
    .btn-generate {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: var(--orange-glow);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(255, 94, 0, 0.3);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-generate:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(255, 94, 0, 0.5);
      filter: brightness(1.1);
    }

    /* ==========================================================================
       🔴 卡片預覽區（3D 懸浮與金屬外框）
       ========================================================================== */
    .preview-stage {
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1200px;
      min-height: 480px;
    }

    .interactive-card {
      width: 100%;
      max-width: 500px;
      height: 300px;
      border-radius: 28px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }

    .preview-stage:hover .interactive-card {
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.5),
        0 0 50px rgba(255, 94, 0, 0.3);
    }

    /* 卡片正面與背面（奢華暗金玻璃擬態） */
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 28px;
      padding: 44px;
      display: flex;
      flex-direction: column;
      justify-content: center; /* 移除頂底裝飾，內容完美居中 */
      align-items: center;
      border: 1.5px solid var(--metal-border);
      background: var(--glass-bg);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      text-align: center;
    }

    .card-back {
      transform: rotateY(180deg);
      background: rgba(15, 10, 8, 0.85); /* 背面稍微加深，突出解釋文字 */
      border-color: rgba(255, 94, 0, 0.6);
    }

    .interactive-card.is-flipped {
      transform: rotateY(180deg);
    }

    /* ==========================================================================
       🔴 卡片內文資訊（無任何英文裝飾，純粹大氣）
       ========================================================================== */
    .card-title {
      font-size: 32px;
      font-weight: 900;
      line-height: 1.4;
      color: #ffffff;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .card-description {
      font-size: 18px;
      line-height: 1.7;
      color: #ffd0b5;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- AI 動態鮮豔背景 -->
  <div class="ai-dynamic-bg" id="dynamicBg"></div>

  <!-- Bento Grid 主容器 -->
  <div class="bento-container">
    
    <!-- 左側：AI 控制面板 -->
    <div class="glass-panel control-panel">
      <div>
        <h1 class="panel-title"><span>AI</span> 圖卡生成器</h1>
        <p style="font-size: 13px; color: var(--text-sub); line-height: 1.5; margin-top: 6px;">奢華金屬橘主題。無雜訊、極純粹的知識卡片。</p>
      </div>
      
      <div class="input-group">
        <label class="input-label" for="cardTheme">卡片知識主題</label>
        <input type="text" id="cardTheme" placeholder="輸入知識主題..." value="量子糾纏">
      </div>

      <!-- 5 種鮮豔風格控制器 -->
      <div>
        <h3 class="style-controller-title">背景風格設定</h3>
        <div class="style-grid">
          
          <div class="style-btn" onclick="applyStyle('orange neon cyberpunk')">
            賽博奢華橘
            <button class="regen-icon" onclick="event.stopPropagation(); generateNewPhoto('orange neon cyberpunk')">🔄</button>
          </div>

          <div class="style-btn" onclick="applyStyle('vibrant holographic liquid')">
            迷幻液態流光
            <button class="regen-icon" onclick="event.stopPropagation(); generateNewPhoto('vibrant holographic liquid')">🔄</button>
          </div>

          <div class="style-btn" onclick="applyStyle('bold colorful abstract art')">
            大膽極簡抽象
            <button class="regen-icon" onclick="event.stopPropagation(); generateNewPhoto('bold colorful abstract art')">🔄</button>
          </div>

          <div class="style-btn" onclick="applyStyle('vibrant warm sunset')">
            黃金日落餘暉
            <button class="regen-icon" onclick="event.stopPropagation(); generateNewPhoto('vibrant warm sunset')">🔄</button>
          </div>

          <div class="style-btn" onclick="applyStyle('vibrant light trails abstract')">
            迷離迷幻光影
            <button class="regen-icon" onclick="event.stopPropagation(); generateNewPhoto('vibrant light trails abstract')">🔄</button>
          </div>

        </div>
      </div>
      
      <button class="btn-generate" onclick="generatePremiumCard()">動態優化生成</button>
    </div>

    <!-- 右側：卡片 3D 預覽區 -->
    <div class="preview-stage">
      <div class="interactive-card" id="premiumCard" onclick="flipCard()">
        
        <!-- 卡片正面 (完全刪除所有英文飾字) -->
        <div class="card-face card-front">
          <h2 class="card-title" id="frontTitle">量子糾纏</h2>
        </div>

        <!-- 卡片背面 (完全刪除所有英文飾字) -->
        <div class="card-face card-back">
          <p class="card-description" id="backDescription">兩個曾有關聯的微觀粒子，不論彼此相距多遠，當其中一個狀態改變時，另一個也會瞬間發生相應的改變，愛因斯坦曾稱其為「鬼魅般的超距作用」。</p>
        </div>

      </div>
    </div>

  </div>

  <!-- ==========================================================================
       🔴 Pexels API 與極致微互動控制邏輯 (JS)
       ========================================================================== -->
  <script>
    // 預設高流量 Pexels API Key
    const PEXELS_API_KEY = '533012a2e1d153e7a9571653e6692314'; 
    let currentStyle = 'orange neon cyberpunk';

    // 1. 卡片 3D 翻轉控制
    function flipCard() {
      const card = document.getElementById('premiumCard');
      card.classList.toggle('is-flipped');
    }

    // 2. 風格點擊切換
    async function applyStyle(styleKeywords) {
      currentStyle = styleKeywords;
      await fetchPexelsBackground(styleKeywords);
    }

    // 3. 獨立「隨機再生成 🔄」按鈕點擊
    async function generateNewPhoto(styleKeywords) {
      currentStyle = styleKeywords;
      // 隨機獲取不同的頁數或圖片，達到隨機再生成效果
      const randomPage = Math.floor(Math.random() * 15) + 1;
      await fetchPexelsBackground(styleKeywords, randomPage);
    }

    // 4. 動態優化生成
    async function generatePremiumCard() {
      const theme = document.getElementById('cardTheme').value || '未知領域';
      
      // 更新正面
      document.getElementById('frontTitle').innerText = theme;
      
      // AI 模擬寫入背面的動態效果
      simulateAITyping("backDescription", `我們正在深入探索【${theme}】的核心脈絡。摒棄所有雜訊與無用英文裝飾，讓純粹的知識在最鮮豔、最奢華的金屬橘介面中，深深烙印在大腦深處。`);

      // 生成時自動抓取當前風格的一張全新背景
      await generateNewPhoto(currentStyle);
    }

    // 5. Pexels 動態圖像抓取與呼吸淡入淡出 (支援隨機分頁)
    async function fetchPexelsBackground(keyword, page = 1) {
      const bgContainer = document.getElementById('dynamicBg');
      const url = `https://api.pexels.com/v1/search?query=${encodeURIComponent(keyword)}&per_page=1&page=${page}`;

      try {
        const response = await fetch(url, {
          headers: { Authorization: PEXELS_API_KEY }
        });
        const data = await response.json();
        
        if (data.photos && data.photos.length > 0) {
          const newImageUrl = data.photos[0].src.large2x;
          
          // 極致流暢的 1.2 秒過渡
          bgContainer.style.opacity = '0.1';
          setTimeout(() => {
            bgContainer.style.backgroundImage = `url('${newImageUrl}')`;
            bgContainer.style.opacity = '1';
          }, 400); 
        }
      } catch (error) {
        console.warn("Pexels 載入失敗：", error);
      }
    }

    // 6. 輔助：AI 打字機動效
    function simulateAITyping(elementId, text) {
      const element = document.getElementById(elementId);
      element.innerHTML = '';
      let i = 0;
      function typing() {
        if (i < text.length) {
          element.innerHTML += text.charAt(i);
          i++;
          setTimeout(typing, 20);
        }
      }
      typing();
    }
  </script>
</body>
</html>
