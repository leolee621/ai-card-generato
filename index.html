<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>AI Course Card Studio | Pro Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>
    <style>
        body { background: #0b0f19; color: #fff; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .canvas-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #111; border-radius: 24px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #previewCanvas { position: absolute; width: 100%; height: 100%; }
    </style>
</head>
<body class="p-8">
    <main class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
        <!-- 左側控制面板 -->
        <section class="lg:col-span-4 glass p-8 rounded-3xl space-y-6">
            <h2 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">Studio Controls</h2>
            <input id="mainTxt" type="text" placeholder="輸入主標題..." class="w-full bg-black/20 p-4 rounded-xl border border-white/10 outline-none focus:border-blue-500">
            
            <div class="space-y-2">
                <label class="text-xs text-gray-400 uppercase">人物對齊</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="setPos('left')" class="p-3 bg-white/5 rounded-lg hover:bg-blue-600 transition">靠左</button>
                    <button onclick="setPos('right')" class="p-3 bg-white/5 rounded-lg hover:bg-blue-600 transition">靠右</button>
                </div>
            </div>

            <input type="file" id="imgUpload" class="w-full p-4 bg-white/5 rounded-xl border border-dashed border-gray-600">
            <button onclick="generateBackground()" class="w-full p-4 bg-white text-black font-bold rounded-xl hover:scale-[1.01] transition">更換 AI 背景</button>
            <button onclick="exportResult()" class="w-full p-4 bg-blue-600 font-bold rounded-xl shadow-lg shadow-blue-600/20">匯出成品</button>
        </section>

        <!-- 右側預覽區 -->
        <section class="lg:col-span-8">
            <div id="canvasBox" class="canvas-wrap shadow-2xl">
                <canvas id="previewCanvas"></canvas>
            </div>
        </section>
    </main>

<script type="module">
    import { PEXELS_API } from './config.js';

    // 將所有函式掛載到 window，這樣 HTML 按鈕才能正確觸發
    window.generateBackground = async () => {
        try {
            const res = await fetch(`https://api.pexels.com/v1/search?query=luxury+abstract+professional&per_page=20`, {
                headers: { 'Authorization': PEXELS_API }
            });
            const data = await res.json();
            // ... (其餘背景生成邏輯)
            console.log("背景生成成功");
        } catch (err) {
            console.error("生成失敗，請確認 config.js 是否正確引用", err);
        }
    };

    // 其他邏輯函式也請放在這個 module 區塊內，並用 window.函式名 = ...
</script>
</body>
</html>
