<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>AI Studio - 高質感圖卡產生器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: #fff; font-family: sans-serif; }
        /* 核心關鍵：將背景交給 CSS 控制，這是不會失敗的寫法 */
        #canvasBox { 
            width: 100%; aspect-ratio: 16/9; 
            background: #222 url('') no-repeat center center; 
            background-size: cover; 
            border-radius: 16px; 
            display: flex; align-items: center; justify-content: center; 
            position: relative; border: 1px solid #333; 
        }
    </style>
</head>
<body class="p-10">
    <div class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
        <div class="space-y-4">
            <h1 class="text-xl font-bold">Studio Controls</h1>
            <input id="titleInput" type="text" placeholder="輸入標題..." class="w-full bg-black p-3 rounded border border-gray-700">
            <button id="btn" class="w-full bg-white text-black py-3 rounded font-bold hover:bg-gray-200">更換 AI 背景</button>
        </div>

        <div class="md:col-span-2">
            <div id="canvasBox">
                <h1 id="titleDisplay" class="text-4xl font-black drop-shadow-2xl px-10"></h1>
            </div>
        </div>
    </div>

    <script>
        const btn = document.getElementById('btn');
        const box = document.getElementById('canvasBox');

        btn.addEventListener('click', async () => {
            btn.innerText = "載入中...";
            try {
                // 使用一個更穩定的圖片接口來源
                const res = await fetch('https://api.pexels.com/v1/search?query=luxury&per_page=10', {
                    headers: { 'Authorization': 'RKN05GazMkLLJiykYmmsZTWELjtDPmMexoOahZz8LwoveEHwug6JhErh' }
                });
                const data = await res.json();
                const photo = data.photos[Math.floor(Math.random() * data.photos.length)];
                
                // 直接變更 CSS 背景圖
                box.style.backgroundImage = `url(${photo.src.large2x})`;
                btn.innerText = "更換 AI 背景";
            } catch (e) {
                console.error(e);
                alert("載入失敗，請檢查網路");
                btn.innerText = "更換 AI 背景";
            }
        });

        document.getElementById('titleInput').addEventListener('input', (e) => {
            document.getElementById('titleDisplay').innerText = e.target.value;
        });
    </script>
</body>
</html>
