<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Horizon Design System | 頂流介面</title>
    <style>
        :root { --accent: #ff5e00; --bg: #050505; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        /* 視覺引擎 */
        #viewport { position: fixed; inset: 0; z-index: -1; background-size: cover; background-position: center; transition: 1s ease; }
        
        /* 側邊欄風格切換 */
        .sidebar { width: 300px; padding: 40px; display: flex; flex-direction: column; gap: 20px; backdrop-filter: blur(20px); border-right: 1px solid rgba(255,255,255,0.1); }
        .style-btn { padding: 12px; border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .style-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* 主舞台 */
        .main { flex: 1; display: flex; justify-content: center; align-items: center; perspective: 1000px; }
        .card { width: 400px; height: 250px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); border: 1px solid var(--accent); border-radius: 20px; display: flex; align-items: center; justify-content: center; transition: 0.6s; cursor: pointer; }
        .card:hover { transform: rotateY(10deg) scale(1.05); box-shadow: 0 0 50px rgba(255,94,0,0.3); }
    </style>
</head>
<body>
    <div id="viewport"></div>
    <div class="sidebar">
        <h3>選擇你的視覺風格</h3>
        <div class="style-btn" onclick="applyTheme('cyber')">賽博奢華橘</div>
        <div class="style-btn" onclick="applyTheme('liquid')">迷幻液態流光</div>
        <div class="style-btn" onclick="applyTheme('abstract')">大膽極簡抽象</div>
        <div class="style-btn" onclick="applyTheme('sunset')">黃金日落餘暉</div>
        <div class="style-btn" onclick="applyTheme('dark')">迷離暗黑迷宮</div>
    </div>
    <div class="main">
        <div class="card" id="card"><h2>請選擇風格，即刻啟動</h2></div>
    </div>

    <script>
        const API_KEY = '請填入你的API_KEY';
        
        async function applyTheme(type) {
            const queryMap = {
                'cyber': 'orange neon abstract',
                'liquid': 'holographic liquid flow',
                'abstract': 'minimalist geometric art',
                'sunset': 'golden hour sunset',
                'dark': 'dark minimal tech'
            };
            
            // 背景切換邏輯
            const viewport = document.getElementById('viewport');
            const res = await fetch(`https://api.pexels.com/v1/search?query=${queryMap[type]}&per_page=1`, {
                headers: { Authorization: API_KEY }
            });
            const data = await res.json();
            if(data.photos?.length) {
                viewport.style.backgroundImage = `url(${data.photos[0].src.large2x})`;
            }
        }
    </script>
</body>
</html>
