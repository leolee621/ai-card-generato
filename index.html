<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>AI Course Card Studio | Pro Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0b0f19; color: #fff; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .canvas-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #111; border-radius: 24px; overflow: hidden; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; transition: all 0.5s ease; }
        .text-layer { position: absolute; padding: 40px; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; }
    </style>
</head>
<body class="p-8">
    <main class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
        <section class="lg:col-span-4 glass p-8 rounded-3xl space-y-6">
            <h2 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">Studio Controls</h2>
            <input id="mainTxt" type="text" placeholder="輸入主標題..." class="w-full bg-black/20 p-4 rounded-xl border border-white/10 outline-none focus:border-blue-500">
            <div class="grid grid-cols-2 gap-2">
                <button onclick="window.setPos('left')" class="p-3 bg-white/5 rounded-lg hover:bg-blue-600 transition">靠左</button>
                <button onclick="window.setPos('right')" class="p-3 bg-white/5 rounded-lg hover:bg-blue-600 transition">靠右</button>
            </div>
            <button onclick="window.generateBackground()" class="w-full p-4 bg-white text-black font-bold rounded-xl hover:scale-[1.01] transition">更換 AI 背景</button>
            <button onclick="window.exportResult()" class="w-full p-4 bg-blue-600 font-bold rounded-xl shadow-lg shadow-blue-600/20">匯出高畫質圖卡</button>
        </section>

        <section class="lg:col-span-8">
            <div id="canvasBox" class="canvas-wrap shadow-2xl">
                <div id="textOverlay" class="text-layer">
                    <h1 id="titleDisplay" class="text-5xl font-black drop-shadow-lg opacity-0 transition-all duration-500"></h1>
                </div>
                <p id="placeholderText" class="text-gray-500">等待 AI 載入視覺...</p>
            </div>
        </section>
    </main>

    <script type="module">
        import { PEXELS_API } from './config.js';

        // 綁定全域函式供 HTML 按鈕呼叫
        window.generateBackground = async () => {
            const box = document.getElementById('canvasBox');
            const placeholder = document.getElementById('placeholderText');
            try {
                const res = await fetch(`https://api.pexels.com/v1/search?query=luxury+abstract+professional&per_page=20`, {
                    headers: { 'Authorization': PEXELS_API }
                });
                const data = await res.json();
                const photo = data.photos[Math.floor(Math.random() * data.photos.length)];
                if(photo) {
                    box.style.backgroundImage = `url(${photo.src.large2x})`;
                    placeholder.style.display = 'none';
                }
            } catch (err) { console.error("API 請求錯誤:", err); }
        };

        window.setPos = (pos) => {
            document.getElementById('textOverlay').style.alignItems = pos === 'left' ? 'flex-start' : 'flex-end';
            document.getElementById('textOverlay').style.textAlign = pos === 'left' ? 'left' : 'right';
        };

        window.exportResult = () => {
            alert("正在套用電影級濾鏡並匯出...");
            // 這裡未來可接 html2canvas 進行渲染
        };

        // 即時輸入動畫
        document.getElementById('mainTxt').addEventListener('input', (e) => {
            const title = document.getElementById('titleDisplay');
            title.innerText = e.target.value;
            title.classList.remove('opacity-0', 'translate-y-4');
            title.classList.add('opacity-100', 'translate-y-0');
        });
    </script>
</body>
</html>
