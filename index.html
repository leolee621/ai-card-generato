<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 奢華金屬橘圖卡生成器</title>
  
  <!-- 導入高質感、具空氣感的中文黑體 (繁體字美化) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       🔴 奢華愛馬仕橘金屬配色與核心變數
       ========================================================================== */
    :root {
      --font-primary: 'Noto Sans TC', sans-serif;
      --orange-primary: #ff5e00; /* 愛馬仕橘 */
      --orange-glow: linear-gradient(135deg, #ff9f43 0%, #ff5e00 100%);
      --metal-border: rgba(255, 94, 0, 0.45); /* 金屬橘折射邊框 */
      --glass-bg: rgba(20, 15, 12, 0.7); /* 暗金色調半透明玻璃 */
      --text-main: #ffffff;
      --text-sub: #ffbd9b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      background: #0a0806; /* 曜石黑打底防止閃爍 */
    }

    /* ==========================================================================
       🔴 Pexels 智慧鮮豔背景 (高飽和度磨砂景深濾鏡)
       ========================================================================== */
    .ai-dynamic-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      /* 預設鮮豔橘色宇宙流光背景 */
      background-image: url('https://images.pexels.com/photos/1103970/pexels-photo-1103970.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2');
      background-size: cover;
      background-position: center;
      filter: blur(60px) brightness(0.85) saturate(2); /* 超高飽和度、極度鮮豔 */
      transform: scale(1.15); /* 消除邊緣模糊露白 */
      transition: background-image 2s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.2s ease;
    }

    /* ==========================================================================
       🔴 佈局：超越 SAT.COOL 的 Bento Grid (便當盒排版)
       ========================================================================== */
    .bento-container {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 32px;
      width: 90%;
      max-width: 1200px;
      margin: 40px auto;
      z-index: 1;
    }

    @media (max-width: 1024px) {
      .bento-container {
        grid-template-columns: 1fr;
        gap: 24px;
      }
    }

    /* ==========================================================================
       🔴 奢華暗金玻璃擬態面板 (Glassmorphism)
       ========================================================================== */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(40px) saturate(140%);
      -webkit-backdrop-filter: blur(40px) saturate(140%);
      border: 1.5px solid var(--metal-border);
      border-radius: 28px;
      padding: 36px;
      box-shadow: 
        0 4px 30px rgba(255, 94, 0, 0.05), 
        0 30px 60px rgba(0, 0, 0, 0.4);
    }

    .control-panel {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .panel-title {
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .panel-title span {
      background: var(--orange-glow);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ==========================================================================
       🎨 5 種鮮豔背景風格控制區 (UI 排版)
       ========================================================================== */
    .style-controller-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 12px;
      letter-spacing: 1.5px;
    }

    .style-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .style-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 94, 0, 0.20);
      padding: 12px 18px;
      border-radius: 14px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .style-btn:hover, .style-btn.active {
      background: rgba(255, 94, 0, 0.15);
      border-color: var(--orange-primary);
      box-shadow: 0 0 15px rgba(255, 94, 0, 0.1);
    }

    /* 隨機再生成 🔄 按鈕 (橘色微光邊框與金屬觸感) */
    .regen-icon {
      background: rgba(255, 94, 0, 0.25);
      border: 1px solid var(--orange-primary);
      color: #ffffff;
      border-radius: 8px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .regen-icon:hover {
      background: var(--orange-primary);
      transform: rotate(180deg);
      box-shadow: 0 0 10px var(--orange-primary);
    }

    /* 工業風輸入欄 */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1.5px solid rgba(255, 94, 0, 0.3);
      background: rgba(0, 0, 0, 0.3);
      font-size: 15px;
      color: #ffffff;
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus {
      border-color: var(--orange-primary);
      box-shadow: 0 0 0 4px rgba(255, 94, 0, 0.25);
    }

    /* 金屬橘主生成按鈕 */
    .btn-generate {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: var(--orange-glow);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(255, 94, 0, 0.3);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-generate:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(255, 94, 0, 0.5);
      filter: brightness(1.1);
    }

    /* ==========================================================================
       🔴 卡片預覽區：3D 物理懸浮、折射與翻轉
       ========================================================================== */
    .preview-stage {
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1200px;
      min-height: 480px;
    }

    .interactive-card {
      width: 100%;
      max-width: 500px;
      height: 300px;
      border-radius: 28px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }

    .preview-stage:hover .interactive-card {
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.5),
        0 0 50px rgba(255, 94, 0, 0.3);
    }

    /* 玻璃卡片正面與背面 (純化：拿掉所有英文副標飾字，只留核心內容) */
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 28px;
      padding: 44px;
      display: flex;
      flex-direction: column;
      justify-content: center; /* 內容居中，避免雜亂 */
      align-items: center;
      border: 1.5px solid var(--metal-border);
      background: var(--glass-bg);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      text-align: center;
    }

    .card-back {
      transform: rotateY(180deg);
      background: rgba(15, 10, 8, 0.85); /* 稍微加深便於文字辨識 */
      border-color: rgba(255, 94, 0, 0.6);
    }

    .interactive-card.is-flipped {
      transform: rotateY(180deg);
    }

    /* ==========================================================================
       🔴 資訊層級（完全無英文裝飾，純粹大氣）
       ========================================================================== */
    .card-title {
      font-size: 32px;
      font-weight: 900;
      line-height: 1.4;
      color: #ffffff;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
    }

    .card-description {
      font-size: 18px;
      line-height: 1.7;
      color: #ffd0b5;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- AI 動態鮮豔背景 -->
  <div class="ai-dynamic-bg" id="dynamicBg"></div>

  <!-- Bento Grid 主容器 -->
  <div class="bento-container">
    
    <!-- 左側：AI 控制面板 -->
    <div class="glass-panel control-panel">
      <div>
        <h1 class="panel-title"><span>AI</span> 圖卡生成器</h1>
        <p style="font-size: 13px; color: var(--text-sub); line-height: 1.5; margin-top: 6px;">
          奢華橘金屬美學。無任何雜訊干擾的純粹知識體驗。
        </p>
      </div>
      
      <div class="input-group">
        <label class="input-label" for="cardTheme">卡片知識主題</label>
        <input type="text" id="cardTheme" placeholder="輸入主題..." value="量子糾纏">
      </div>

      <!-- 5 種極致鮮豔風格控制器 -->
      <div>
        <h3 class="style-controller-title">背景氛圍風格</h3>
        <div class="style-grid">
          
          <div class="style-btn active" id="btn-cyber" onclick="applyStyle('orange neon cyberpunk', 'btn-cyber')">
            賽博奢華橘
            <button class="regen-icon" onclick="event.stopPropagation(); generateNewPhoto('orange neon cyberpunk')">🔄</button>
          </div>

          <div class="style-btn" id="btn-liquid" onclick="applyStyle('vibrant holographic liquid', 'btn-liquid')">
            迷幻液態流光
            <button class="regen-icon" onclick="event.stopPropagation(); generateNewPhoto('vibrant holographic liquid')">🔄</button>
          </div>

          <div class="style-btn" id="btn-abstract" onclick="applyStyle('bold colorful abstract art', 'btn-abstract')">
            大膽極簡抽象
            <button class="regen-icon" onclick="event.stopPropagation(); generateNewPhoto('bold colorful abstract art')">🔄</button>
          </div>

          <div class="style-btn" id="btn-sunset" onclick="applyStyle('vibrant warm sunset', 'btn-sunset')">
            黃金日落餘暉
            <button class="regen-icon" onclick="event.stopPropagation(); generateNewPhoto('vibrant warm sunset')">🔄</button>
          </div>

          <div class="style-btn" id="btn-light" onclick="applyStyle('vibrant light trails abstract', 'btn-light')">
            迷離迷幻光影
            <button class="regen-icon" onclick="event.stopPropagation(); generateNewPhoto('vibrant light trails abstract')">🔄</button>
          </div>

        </div>
      </div>
      
      <button class="btn-generate" onclick="generatePremiumCard()">動態優化生成</button>
    </div>

    <!-- 右側：卡片 3D 預覽區 (無英文、完美置中) -->
    <div class="preview-stage">
      <div class="interactive-card" id="premiumCard" onclick="flipCard()">
        
        <!-- 卡片正面 -->
        <div class="card-face card-front">
          <h2 class="card-title" id="frontTitle">量子糾纏</h2>
        </div>

        <!-- 卡片背面 -->
        <div class="card-face card-back">
          <p class="card-description" id="backDescription">兩個曾有關聯的微觀粒子，不論彼此相距多遠，當其中一個狀態改變時，另一個也會瞬間發生相應的改變，愛因斯坦曾稱其為「鬼魅般的超距作用」。</p>
        </div>

      </div>
    </div>

  </div>

  <!-- ==========================================================================
       🔴 Pexels API 與微互動控制邏輯 (JS)
       ========================================================================== -->
  <script>
    // 開放免費 Pexels API 金鑰 (你可以替換為個人金鑰)
    const PEXELS_API_KEY = '533012a2e1d153e7a9571653e6692314'; 
    let currentStyle = 'orange neon cyberpunk';

    // 1. 卡片 3D 翻轉邏輯
    function flipCard() {
      const card = document.getElementById('premiumCard');
      card.classList.toggle('is-flipped');
    }

    // 2. 風格按鈕切換並獲取背景
    async function applyStyle(styleKeywords, btnId) {
      currentStyle = styleKeywords;
      
      // 切換按鈕的 Active 視覺狀態
      document.querySelectorAll('.style-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(btnId).classList.add('active');

      await fetchPexelsBackground(styleKeywords);
    }

    // 3. 獨立 🔄 按鈕：獲取該風格下的隨機不同頁面（達到隨機再生成效果）
    async function generateNewPhoto(styleKeywords) {
      currentStyle = styleKeywords;
      const randomPage = Math.floor(Math.random() * 20) + 1;
      await fetchPexelsBackground(styleKeywords, randomPage);
    }

    // 4. 動態優化生成 (主按鈕)
    async function generatePremiumCard() {
      const theme = document.getElementById('cardTheme').value || '極緻知識';
      
      // 更新卡片正面文字
      document.getElementById('frontTitle').innerText = theme;
      
      // 模擬 AI 動態生成答案的打字機效果
      simulateAITyping("backDescription", `我們正在深入探索【${theme}】的核心脈絡。摒棄所有雜訊與無用英文裝飾，讓純粹的知識在最鮮豔、最奢華的金屬橘介面中，深深地烙印在大腦深處。`);

      // 每次點擊生成，自動重新隨機替換一次背景圖
      await generateNewPhoto(currentStyle);
    }

    // 5. Pexels 動態圖像抓取與呼吸式漸變
    async function fetchPexelsBackground(keyword, page = 1) {
      const bgContainer = document.getElementById('dynamicBg');
      const url = `https://api.pexels.com/v1/search?query=${encodeURIComponent(keyword)}&per_page=1&page=${page}`;

      try {
        const response = await fetch(url, {
          headers: { Authorization: PEXELS_API_KEY }
        });
        const data = await response.json();
        
        if (data.photos && data.photos.length > 0) {
          const newImageUrl = data.photos[0].src.large2x;
          
          // 精緻的 1.2 秒過渡：淡出 -> 更換 -> 淡入
          bgContainer.style.opacity = '0.2';
          setTimeout(() => {
            bgContainer.style.backgroundImage = `url('${newImageUrl}')`;
            bgContainer.style.opacity = '1';
          }, 400); 
        }
      } catch (error) {
        console.warn("Pexels 載入失敗，採用預設背景：", error);
      }
    }

    // 6. 模擬 AI 精緻打字效果
    function simulateAITyping(elementId, text) {
      const element = document.getElementById(elementId);
      element.innerHTML = '';
      let i = 0;
      function typing() {
        if (i < text.length) {
          element.innerHTML += text.charAt(i);
          i++;
          setTimeout(typing, 20);
        }
      }
      typing();
    }
  </script>
</body>
</html>
