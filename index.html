<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Horizon Orange | 頂級 AI 知識介面</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root { --orange: #ff5e00; --bg: #0a0806; }
    body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg); color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; margin: 0; }
    
    #dynamicBg { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 50% 50%, #2e1202 0%, #0a0806 100%); transition: opacity 0.8s ease; }
    .main-wrapper { display: grid; grid-template-columns: 400px 500px; gap: 40px; }
    
    .panel { background: rgba(255,255,255,0.05); backdrop-filter: blur(30px); padding: 40px; border-radius: 30px; border: 1px solid rgba(255,94,0,0.3); }
    input { width: 100%; padding: 15px; border-radius: 15px; border: 1px solid var(--orange); background: transparent; color: white; margin: 20px 0; }
    .gen-btn { width: 100%; padding: 15px; border-radius: 15px; border: none; background: var(--orange); color: white; font-weight: 900; cursor: pointer; }
    
    .card-area { perspective: 1000px; cursor: pointer; }
    .card { width: 500px; height: 300px; position: relative; transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.17, 0.67, 0.38, 1.25); }
    .card.flipped { transform: rotateY(180deg); }
    .face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 40px; border-radius: 20px; border: 1px solid var(--orange); background: rgba(0,0,0,0.6); backface-visibility: hidden; }
    .back { transform: rotateY(180deg); text-align: center; }
  </style>
</head>
<body>
  <div id="dynamicBg"></div>
  <div class="main-wrapper">
    <div class="panel">
      <h1>知識生成系統</h1>
      <input type="text" id="theme" placeholder="輸入探索主題..." value="量子糾纏">
      <button class="gen-btn" onclick="startProcess()">執行生成</button>
    </div>
    <div class="card-area" onclick="document.querySelector('.card').classList.toggle('flipped')">
      <div class="card">
        <div class="face front"><h2 id="title">量子糾纏</h2></div>
        <div class="face back"><p id="desc">點擊執行生成以載入核心脈絡...</p></div>
      </div>
    </div>
  </div>

  <script>
    // 請將下方填入你的 API Key
    const API_KEY = '請輸入你的PexelsAPIKey'; 

    async function startProcess() {
      const theme = document.getElementById('theme').value;
      document.getElementById('title').innerText = theme;
      
      // 更新背景與內容
      fetchBg(theme);
      simulateTyping(document.getElementById('desc'), `正在深入解析「${theme}」的結構。去除所有雜訊，僅保留知識的精髓。`);
    }

    async function fetchBg(query) {
      const bg = document.getElementById('dynamicBg');
      try {
        const res = await fetch(`https://api.pexels.com/v1/search?query=${query}&per_page=1`, { headers: { Authorization: API_KEY } });
        const data = await res.json();
        if(data.photos?.length) {
          bg.style.backgroundImage = `url(${data.photos[0].src.large2x})`;
        }
      } catch(e) { console.log("使用備用渲染模式"); }
    }

    function simulateTyping(el, text) {
      el.innerText = '';
      let i = 0;
      const interval = setInterval(() => {
        el.innerText += text[i++];
        if(i >= text.length) clearInterval(interval);
      }, 30);
    }
  </script>
</body>
</html>
